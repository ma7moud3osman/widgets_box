name: widgets_box
description: "A Flutter package for efficient UI state management, handling
  loading, empty views, content display, caching, and pull-to-refresh with
  customizable widgets."
version: 0.2.0
homepage: https://github.com/abdelrahmanghanem
repository: https://github.com/abdelrahmanghanem/widgets_box

screenshots:
  - path: doc/cover.png
    description: "Widgets Box — a theme-aware Flutter UI framework."
  - path: doc/gallery.png
    description: "Component gallery: buttons, fields, cards, status badges, list rows and state screens."
  - path: doc/styling.png
    description: "Styling precedence: Flutter Theme → WidgetsBoxConfig → per-instance overrides."

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  cached_network_image: ^3.4.1
  country_code_picker: ^3.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  lottie: ^3.3.1
  package_info_plus: ^8.3.0
  phone_numbers_parser: ^9.0.20
  shorebird_code_push: ^2.0.7
  skeletonizer: ^2.1.2
  smart_localize: ^0.0.16
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
